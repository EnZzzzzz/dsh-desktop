appId: ai.deepseek.harness.desktop
productName: dsh-desktop
# Keep every file real on disk: the packaged app spawns a Node child process
# that must read the dsh CLI and its plugin packages by path — none of that
# works from inside an asar archive.
asar: false
# The app ships its dependencies from build/runtime (staged by
# scripts/prepare-runtime.mjs) via extraResources below — the project root's
# node_modules is NOT packaged. Rebuilding root native deps against the
# Electron ABI is therefore wasted work (the dsh runtime runs in the bundled
# Node binary, not in Electron), and @electron/rebuild hangs on this machine.
npmRebuild: false
directories:
  output: dist
# node_modules is shipped VERBATIM via extraResources below, not through
# electron-builder's dependency collector: the dsh plugin tree leans on
# peerDependencies that npm auto-installs but the collector silently drops.
# The source is build/runtime (production deps only, staged by
# scripts/prepare-runtime.mjs) — NOT the project root's node_modules, which
# contains ~600MB of devDependencies.
files:
  - package.json
  - out/**
  # The collector must NOT merge its own idea of production deps into the
  # app: extraResources below already ships the full staged tree verbatim,
  # and a collector pass on top only duplicates packages under nested
  # node_modules (~48MB).
  - '!node_modules/**'
extraResources:
  - from: build/runtime/node_modules
    to: app/node_modules
    filter:
      - '**/*'
      - '!**/.bin'
      # node-gyp's build-time python shim is an absolute symlink; the dumb copy
      # collides with the collector's own pass (EEXIST). Useless at runtime.
      - '!**/node_gyp_bins/**'
  - from: build/node
    to: node
  # Loading-page logo (see logoDataUrl in src/main/index.ts).
  - from: build/icon.png
    to: icon.png
linux:
  target: deb
  category: Development
  icon: build/icon.png
  maintainer: DeepSeek <support@deepseek.com>
deb:
  # Default postinst only chmods 4755 chrome-sandbox when user namespaces are
  # missing, which breaks on Ubuntu 23.10+ AppArmor userns restrictions; our
  # script always sets the SUID bit (see scripts/after-install.sh).
  afterInstall: scripts/after-install.sh
mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns
dmg:
  title: dsh-desktop
  icon: build/icon.icns
